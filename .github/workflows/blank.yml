
name: Build BossForge

on:
  push:
    branches: [main]
    paths:
      - 'BossForge-Project.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Extract BossForge source
        run: |
          unzip -q BossForge-Project.zip -d source
          test -f source/BossForge/build.gradle.kts
          test -f source/BossForge/src/main/java/dev/openai/bossforge/BossForgePlugin.java

      - name: Build plugin
        working-directory: source/BossForge
        run: gradle --no-daemon clean build

      - name: Package resource pack
        run: |
          cd source/BossForge/resource-pack
          zip -qr "$GITHUB_WORKSPACE/BossForge-Resource-Pack-1.21.11.zip" .

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: BossForge-JAR-v1.2.0
          path: source/BossForge/build/libs/BossForge-1.2.0.jar
          if-no-files-found: error

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: BossForge-Resource-Pack-1.21.11
          path: BossForge-Resource-Pack-1.21.11.zip
          if-no-files-found: error
